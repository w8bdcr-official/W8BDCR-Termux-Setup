<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360">
<rect width="1240" height="360" fill="#000000"/>
<text x="20" y="36" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#00ff41">W8BDCR Termux Setup — install flow</text>
<line x1="20" y1="52" x2="1220" y2="52" stroke="#00e5ff" stroke-width="1"/>

<g font-family="DejaVu Sans Mono, monospace">
  <!-- STEP 1 -->
  <rect x="12" y="76" width="208" height="150" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="26" y="104" font-size="14" font-weight="bold" fill="#00ff41">STEP 1</text>
  <text x="26" y="134" font-size="15" font-weight="bold" fill="#ffffff">One command</text>
  <text x="26" y="162" font-size="13" fill="#00ff41">curl install.sh</text>
  <text x="26" y="184" font-size="13" fill="#00ff41">| bash</text>
  <text x="230" y="160" font-size="22" fill="#00ff41">→</text>

  <!-- STEP 2 -->
  <rect x="262" y="76" width="208" height="150" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="276" y="104" font-size="14" font-weight="bold" fill="#00ff41">STEP 2</text>
  <text x="276" y="134" font-size="15" font-weight="bold" fill="#ffffff">Install tools</text>
  <text x="276" y="162" font-size="13" fill="#00ff41">python + git</text>
  <text x="276" y="184" font-size="13" fill="#00ff41">via pkg</text>
  <text x="480" y="160" font-size="22" fill="#00ff41">→</text>

  <!-- STEP 3 -->
  <rect x="512" y="76" width="208" height="150" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="526" y="104" font-size="14" font-weight="bold" fill="#00ff41">STEP 3</text>
  <text x="526" y="134" font-size="15" font-weight="bold" fill="#ffffff">Clone repo</text>
  <text x="526" y="162" font-size="13" fill="#00ff41">W8BDCR-</text>
  <text x="526" y="184" font-size="13" fill="#00ff41">TermuxStylePro</text>
  <text x="730" y="160" font-size="22" fill="#00ff41">→</text>

  <!-- STEP 4 -->
  <rect x="762" y="76" width="208" height="150" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="776" y="104" font-size="14" font-weight="bold" fill="#00ff41">STEP 4</text>
  <text x="776" y="134" font-size="15" font-weight="bold" fill="#ffffff">Pick style</text>
  <text x="776" y="162" font-size="13" fill="#00ff41">Matrix 3 · Green 1</text>
  <text x="776" y="184" font-size="13" fill="#00ff41">w8bdcr-official</text>
  <text x="980" y="160" font-size="22" fill="#00ff41">→</text>

  <!-- STEP 5 -->
  <rect x="1012" y="76" width="208" height="150" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="1026" y="104" font-size="14" font-weight="bold" fill="#00ff41">STEP 5</text>
  <text x="1026" y="134" font-size="15" font-weight="bold" fill="#ffffff">Done</text>
  <text x="1026" y="162" font-size="13" fill="#00ff41">auto-start on</text>
  <text x="1026" y="184" font-size="13" fill="#00ff41">every open</text>
</g>

<text x="20" y="286" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#00ff41">[w8bdcr-official@MATRIX]-[~] $ source ~/.bashrc</text>
<text x="20" y="322" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#00803c">one command · styled termux · every start</text>
</svg>
